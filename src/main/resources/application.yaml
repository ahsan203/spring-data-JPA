spring:
  application:
    name: Spring-data-JPA
  datasource:
    url: jdbc:mysql://localhost:3306/springjpa
    username: root
    password: mysql
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
     ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
server:
  port: 0




